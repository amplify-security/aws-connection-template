name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Tag a merged commit."; exit 1; }
          version="$(yq '.Outputs.TemplateVersion.Value' AmplifyConsoleAccess.yaml)"
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "::error::$GITHUB_REF_NAME does not match TemplateVersion $version."; exit 1; }
      - run: sha256sum AmplifyConsoleAccess.yaml > AmplifyConsoleAccess.yaml.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: AmplifyConsoleAccess.yaml
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" AmplifyConsoleAccess.yaml AmplifyConsoleAccess.yaml.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
